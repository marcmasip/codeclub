<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
"http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<busconfig>

	<listen>unix:path=/run/dbus/system_bus_socket</listen>
	
    <!-- System-wide D-Bus configuration for X Windows and basic services -->

    <!-- Security policies: Deny all actions by default
    <policy context="default">
        <deny send_destination="*" eavesdrop="true"/>
        <deny own="*"/>
        <deny send_interface="*"/>
    </policy> -->

    <!-- Allow essential system services (e.g., root, dbus, messagebus) -->
    <policy user="root">
        <allow own="*"/>
        <allow send_destination="*"/>
        <allow send_interface="*"/>
        <allow eavesdrop="true"/>
    </policy>
    <policy user="marc">
        <allow send_destination="*"/>
        <allow send_interface="*"/>
        <allow eavesdrop="true"/>
    </policy>
    
    
	 <!-- <policy user="pulse">
		<allow own="org.pulseaudio.Server"/>
	  </policy>-->

    <!-- Allow communication with X Windows-related services -->
    <policy context="default">
        <allow send_destination="org.x11"/>
        <allow send_destination="org.freedesktop.DisplayManager"/>
        <allow send_destination="org.gnome"/>
        <allow send_destination="org.kde"/>
        <allow send_interface="org.freedesktop.DisplayManager"/>
        <allow send_interface="org.gnome"/>
        <allow send_interface="org.kde"/>
    </policy>

    <!-- Allow system services like login1 and PolicyKit for session management -->
    <policy context="default">
        <allow send_destination="org.freedesktop.login1"/>
        <allow send_destination="org.freedesktop.PolicyKit1"/>
        <allow send_interface="org.freedesktop.login1"/>
        <allow send_interface="org.freedesktop.PolicyKit1"/>
    </policy>

    <!-- Allow services needed for network management (e.g., NetworkManager) -->
    <policy context="default">
        <allow send_destination="org.freedesktop.NetworkManager"/>
        <allow send_interface="org.freedesktop.NetworkManager"/>
    </policy>

</busconfig>
